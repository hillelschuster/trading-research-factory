# Gold Rush Pro – EURUSD WFA Configuration
# Multi-asset test: Same strategy on EURUSD
# Note: RSI thresholds may need adjustment for forex vs gold

walk_forward:
  training_months: 6
  testing_months: 1
  step_months: 1
  n_parameter_trials: 30
  use_vectorized_backtest: true
  performance_mode: true
  save_detailed_results: true
  save_window_data: false
  output_directory: "strategies/gold_rush_pro_eurusd/results"

data:
  source_file: "data/Eurousd_M15_2003-2025/EURUSD_M15_2003_2025_COMBINED.csv"
  min_required_bars: 1000

strategy:
  profile_key: "EURUSD_GOLD_RUSH_PRO"
  parameter_ranges:
    rsi_period: [10, 14, 20]
    rsi_threshold: [25.0, 30.0, 35.0, 40.0, 45.0]
    atr_period: [10, 14, 20]
    atr_sl_multiplier: [1.0, 1.5, 2.0, 2.5]
    hold_days: [1, 2, 3, 5]
    entry_day: [3, 4, 5]

backtest:
  initial_balance: 100000.0
  fees: 0.0001
  slippage: 0.0001

performance:
  max_execution_time_seconds: 3600
  skip_database_persistence: true

logging:
  level: "INFO"
  console_output: true
  file_output: true
  log_file: "logs/wfa_gold_rush_pro_eurusd.log"
