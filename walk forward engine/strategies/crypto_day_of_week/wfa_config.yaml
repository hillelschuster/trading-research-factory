# Crypto Day-of-Week MACD Strategy – WFA Configuration
# Day-of-week momentum with MACD histogram filter for crypto markets
# Smoke-test: limited parameter trials for faster iteration

walk_forward:
  training_months: 3
  testing_months: 1
  step_months: 1
  n_parameter_trials: 20
  use_vectorized_backtest: true
  performance_mode: true
  save_detailed_results: true
  save_window_data: false
  output_directory: "strategies/crypto_day_of_week/results"

data:
  # Using crypto data from workspace (relative to WFA root)
  source_file: "../workspace/data/binance_btcusdt_1h_1000.csv"
  min_required_bars: 500

strategy:
  profile_key: "BTCUSDT_CRYPTO_DOW_MACD"
  parameter_ranges:
    macd_fast: [8, 12, 16]
    macd_slow: [20, 26, 32]
    macd_signal: [7, 9, 11]
    macd_threshold: [-0.5, 0.0, 0.5]
    atr_period: [10, 14, 20]
    atr_sl_multiplier: [1.5, 2.0, 2.5]
    hold_hours: [12, 24, 48]
    entry_day: [2, 3, 4, 5]

backtest:
  initial_balance: 100000.0
  fees: 0.0006  # Higher fees for crypto
  slippage: 0.0005

performance:
  max_execution_time_seconds: 1800
  skip_database_persistence: true

logging:
  level: "INFO"
  console_output: true
  file_output: true
  log_file: "logs/wfa_crypto_dow.log"
