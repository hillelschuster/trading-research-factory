# Phase 8D screening route: EURUSD M15 U.S. Employment Situation/NFP macro-announcement flow.

walk_forward:
  training_months: 6
  testing_months: 3
  step_months: 3
  n_parameter_trials: 12
  min_bars_per_window: 1000
  use_vectorized_backtest: true
  performance_mode: true
  save_detailed_results: true
  save_window_data: false
  output_directory: "strategies/nfp_macro_eurusd/results"

data:
  source_file: "data/Eurousd_M15_2003-2025/EURUSD_M15_2003_2025_COMBINED.csv"
  min_required_bars: 1000
  timezone: "UTC"

strategy:
  profile_key: "NFP_MACRO_EURUSD"
  parameter_ranges:
    atr_period: [10, 14, 20]
    pre_event_lookback: [4, 8, 12]
    reaction_bars: [1, 2]
    min_reaction_return: [0.0, 0.00015, 0.0003, 0.0005]
    pre_range_atr_mult_max: [2.0, 3.0, 5.0, 99.0]
    volume_lookback: [48, 96, 192]
    volume_ratio_max: [1.5, 2.5, 5.0, 99.0]
    max_hold_bars: [2, 4, 8, 12]
    sl_atr_mult: [1.0, 1.5, 2.0]
    tp_atr_mult: [1.5, 2.5, 4.0]
    direction_mode: ["continuation", "fade"]
    release_hour_mode: ["us_dst_approx", "fixed_12_utc", "fixed_13_utc"]

advanced_optimization:
  primary_objective: "sharpe"
  secondary_objectives:
    - "stability"
    - "return"
  stability_weight: 0.15
  n_startup_trials: 6

backtest:
  initial_balance: 10000.0
  fees: 0.0001
  slippage: 0.0001

performance:
  max_execution_time_seconds: 3600
  skip_database_persistence: true

logging:
  level: "INFO"
  console_output: true
  file_output: true
  log_file: "logs/wfa_nfp_macro_eurusd.log"
