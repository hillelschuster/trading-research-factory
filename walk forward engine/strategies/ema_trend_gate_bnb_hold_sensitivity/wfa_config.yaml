# EMA Trend Gate Strategy – Hold Sensitivity WFA Configuration
# BNB/USDT hold_period robustness test
# Testing hold_bars grid [96, 120, 144, 168, 192] with fixed core params
# Goal: Determine if prior 168-bar result is robust or overfit

walk_forward:
  training_months: 3
  testing_months: 1
  step_months: 1
  n_parameter_trials: 50
  min_bars_per_window: 600
  use_vectorized_backtest: true
  performance_mode: true
  save_detailed_results: true
  save_window_data: false
  output_directory: "strategies/ema_trend_gate_bnb_hold_sensitivity/results"

data:
  source_file: "data/binance_bnbusdt_1h_deep.csv"
  min_required_bars: 600

strategy:
  profile_key: "EMA_TREND_GATE"
  parameter_ranges:
    # PINNED: 4h EMA regime detection period
    ema4h_period: [50]
    # PINNED: 1h pullback entry EMA
    ema1h_period: [20]
    # PINNED: RSI lookback
    rsi_period: [14]
    # PINNED: Long entry RSI threshold (fixed at 45)
    rsi_oversold: [45.0]
    # PINNED: Short entry RSI threshold (fixed at 55)
    rsi_overbought: [55.0]
    # TEST GRID: Exit hold bars (1h bars) - 5 values around prior 168 optimum
    hold_bars: [96, 120, 144, 168, 192]
    # PINNED: Stop-loss ATR multiplier
    sl_atr_mult: [2.0]
    # PINNED: Take-profit risk-reward ratio
    tp_rr_mult: [2.0]

advanced_optimization:
  primary_objective: "sharpe"
  secondary_objectives:
    - "stability"
  stability_weight: 0.15
  n_startup_trials: 10

backtest:
  initial_balance: 100000.0
  fees: 0.0006
  slippage: 0.0002

performance:
  max_execution_time_seconds: 1800
  skip_database_persistence: true

logging:
  level: "INFO"
  console_output: true
  file_output: true
  log_file: "logs/wfa_ema_trend_gate_bnb_hold_sensitivity.log"