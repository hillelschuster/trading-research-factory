# Gold Rush Pro – XAUUSD WFA Configuration
# Day-of-week RSI mean-reversion (based on ideas.md Gold_Rush_Pro)
# Smoke-test: limited date range for faster iteration

walk_forward:
  training_months: 6
  testing_months: 1
  step_months: 1
  n_parameter_trials: 30
  use_vectorized_backtest: true
  performance_mode: true
  save_detailed_results: true
  save_window_data: false
  output_directory: "strategies/gold_rush_pro/results"

data:
  source_file: "data/XAUUSD_M15_2018-2025/XAUUSD_M15_2018_2025.csv"
  min_required_bars: 1000

strategy:
  profile_key: "XAUUSD_GOLD_RUSH_PRO"
  parameter_ranges:
    rsi_period: [10, 14, 20]
    rsi_threshold: [30.0, 35.0, 40.0, 45.0, 50.0]
    atr_period: [10, 14, 20]
    atr_sl_multiplier: [1.0, 1.5, 2.0, 2.5]
    hold_days: [1, 2, 3, 5]
    entry_day: [3, 4, 5]

backtest:
  initial_balance: 100000.0
  fees: 0.0001
  slippage: 0.0001

performance:
  max_execution_time_seconds: 3600
  skip_database_persistence: true

logging:
  level: "INFO"
  console_output: true
  file_output: true
  log_file: "logs/wfa_gold_rush_pro.log"
