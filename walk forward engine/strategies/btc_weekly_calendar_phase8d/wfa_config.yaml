# Phase 8D screening route: BTC weekly day-of-week calendar anomaly on H1 bars.

walk_forward:
  training_months: 3
  testing_months: 1
  step_months: 1
  n_parameter_trials: 25
  min_bars_per_window: 600
  use_vectorized_backtest: true
  performance_mode: true
  save_detailed_results: true
  save_window_data: false
  output_directory: "strategies/btc_weekly_calendar_phase8d/results"

data:
  source_file: "data/BTCUSDT/binance_btcusdt_1h_deep.csv"
  min_required_bars: 600
  timezone: "UTC"

strategy:
  profile_key: "BTC_WEEKLY_CALENDAR_PHASE8D"
  parameter_ranges:
    macd_fast: [8, 12, 16]
    macd_slow: [20, 26, 32]
    macd_signal: [7, 9, 11]
    macd_threshold: [-0.5, 0.0, 0.5]
    atr_period: [10, 14, 20]
    atr_sl_multiplier: [1.5, 2.0, 2.5]
    hold_hours: [12, 24, 36, 48]
    entry_day: [1, 2, 3, 4, 5, 6, 7]

advanced_optimization:
  primary_objective: "sharpe"
  secondary_objectives:
    - "stability"
    - "return"
  stability_weight: 0.15
  n_startup_trials: 8

backtest:
  initial_balance: 10000.0
  fees: 0.0006
  slippage: 0.0002

performance:
  max_execution_time_seconds: 3600
  skip_database_persistence: true

logging:
  level: "INFO"
  console_output: true
  file_output: true
  log_file: "logs/wfa_btc_weekly_calendar_phase8d.log"
