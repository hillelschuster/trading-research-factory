# MACD Divergence with RSI Filter – WFA Configuration
# Momentum reversal strategy: hidden bullish/bearish divergence + RSI confirmation
# Test on BTCUSDT 1h candles (5-year dataset, ~43,000 bars)
# EXP-20260321183000-01

walk_forward:
  training_months: 3
  testing_months: 1
  step_months: 1
  n_parameter_trials: 100
  use_vectorized_backtest: true
  performance_mode: true
  save_detailed_results: true
  save_window_data: false
  output_directory: "strategies/macd_divergence/results"

data:
  source_file: "data/binance_btcusdt_1h_deep.csv"
  min_required_bars: 1000

strategy:
  profile_key: "MACD_DIVERGENCE_RSI"
  parameter_ranges:
    macd_fast: [8, 10, 12, 16]
    macd_slow: [20, 24, 26, 32]
    macd_signal: [7, 9, 11]
    div_lookback: [10, 15, 20, 25, 30]
    div_confirm_bars: [2, 3, 4, 5]
    rsi_period: [7, 14, 21]
    rsi_oversold: [30.0, 35.0, 40.0, 45.0]
    rsi_overbought: [55.0, 60.0, 65.0, 70.0]
    hold_bars: [12, 24, 36, 48]
    sl_atr_mult: [1.5, 2.0, 2.5, 3.0]
    atr_period: [10, 14, 20]

advanced_optimization:
  primary_objective: "sharpe"
  secondary_objectives:
    - "return"
    - "stability"
  stability_weight: 0.1
  n_startup_trials: 10

backtest:
  initial_balance: 100000.0
  fees: 0.0006
  slippage: 0.0002

performance:
  max_execution_time_seconds: 3600
  skip_database_persistence: true

logging:
  level: "INFO"
  console_output: true
  file_output: true
  log_file: "logs/wfa_macd_divergence.log"
