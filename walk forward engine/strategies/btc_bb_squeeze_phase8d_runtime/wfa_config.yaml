# Phase 8D BTC BB Width Squeeze runtime-feasibility WFA configuration
# Same mechanism/data/costs as bb_width_squeeze; reduced trial budget records a new denominator attempt after the original 100-trial route timed out before producing accepted WFA output.

walk_forward:
  training_months: 3
  testing_months: 1
  step_months: 1
  n_parameter_trials: 25
  use_vectorized_backtest: true
  performance_mode: true
  save_detailed_results: true
  save_window_data: false
  output_directory: "strategies/btc_bb_squeeze_phase8d_runtime/results"

data:
  source_file: "data/binance_btcusdt_1h_deep.csv"
  min_required_bars: 500

strategy:
  profile_key: "BB_WIDTH_SQUEEZE"
  parameter_ranges:
    bb_period: [10, 15, 20, 25]
    bb_std: [1.5, 2.0, 2.5]
    width_period: [10, 20, 30]
    squeeze_pct: [10.0, 15.0, 20.0, 25.0]
    momentum_period: [10, 15, 20, 30]
    hold_bars: [12, 24, 36, 48]
    sl_atr_mult: [1.5, 2.0, 2.5, 3.0]
    atr_period: [10, 14, 20]

advanced_optimization:
  primary_objective: "sharpe"
  secondary_objectives:
    - "return"
    - "stability"
  stability_weight: 0.15
  n_startup_trials: 10

backtest:
  initial_balance: 100000.0
  fees: 0.0006
  slippage: 0.0002

performance:
  max_execution_time_seconds: 1800
  skip_database_persistence: true

logging:
  level: "INFO"
  console_output: true
  file_output: true
  log_file: "logs/wfa_btc_bb_squeeze_phase8d_runtime.log"
