# Volume Profile Strategy – WFA Configuration
# Order flow strategy using VWAP, volume spikes, and cumulative volume delta
# Test on BTC, ETH, SOL 1h data

walk_forward:
  training_months: 3
  testing_months: 1
  step_months: 1
  n_parameter_trials: 25
  use_vectorized_backtest: true
  performance_mode: true
  save_detailed_results: true
  save_window_data: false
  output_directory: "strategies/volume_profile/results"

data:
  source_file: "workspace/data/binance_btcusdt_1h_1000.csv"
  min_required_bars: 1000

strategy:
  profile_key: "VOLUME_PROFILE"
  parameter_ranges:
    vwap_period: [10, 20, 30, 50]
    volume_ma_period: [10, 20, 30]
    volume_spike_mult: [1.5, 2.0, 2.5, 3.0]
    hold_bars: [8, 12, 16, 24]
    sl_atr_multiplier: [1.5, 2.0, 2.5]
    use_cvd: [true, false]
    cvd_lookback: [10, 20, 30]

backtest:
  initial_balance: 100000.0
  fees: 0.0006
  slippage: 0.0002

performance:
  max_execution_time_seconds: 1800
  skip_database_persistence: true

logging:
  level: "INFO"
  console_output: true
  file_output: true
  log_file: "logs/wfa_volume_profile.log"
