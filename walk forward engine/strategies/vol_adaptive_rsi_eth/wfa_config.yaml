# Volatility-Adaptive RSI on ETH — WFA Configuration
# Pure RSI pullback (no multi-timeframe filter) with volatility-scaled stops
# EXP-20260322000000-01 | 5 params optimized × 100 trials on 7.5yr ETH data

walk_forward:
  training_months: 3
  testing_months: 1
  step_months: 1
  n_parameter_trials: 100
  min_bars_per_window: 600
  use_vectorized_backtest: true
  performance_mode: true
  save_detailed_results: true
  save_window_data: false
  output_directory: "strategies/vol_adaptive_rsi_eth/results"

data:
  source_file: "data/binance_ethusdt_1h_deep.csv"
  min_required_bars: 600

strategy:
  profile_key: "VOL_ADAPTIVE_RSI"
  parameter_ranges:
    # PINNED: RSI lookback
    rsi_period: [14]
    # OPTIMIZED: Long entry RSI level
    rsi_oversold: [25.0, 30.0, 35.0, 40.0]
    # OPTIMIZED: Short entry RSI level
    rsi_overbought: [60.0, 65.0, 70.0, 75.0]
    # OPTIMIZED: Exit hold bars (1h bars)
    hold_bars: [24, 48, 72, 96]
    # PINNED: ATR period for stop calculation
    atr_period: [14]
    # OPTIMIZED: Stop-loss ATR multiplier (also determines TP at 1:1 RR)
    sl_atr_mult: [1.5, 2.0, 2.5, 3.0]

advanced_optimization:
  primary_objective: "sharpe"
  secondary_objectives:
    - "stability"
  stability_weight: 0.15
  n_startup_trials: 10

backtest:
  initial_balance: 100000.0
  fees: 0.0006
  slippage: 0.0002

performance:
  max_execution_time_seconds: 1800
  skip_database_persistence: true

logging:
  level: "INFO"
  console_output: true
  file_output: true
  log_file: "logs/wfa_vol_adaptive_rsi_eth.log"
