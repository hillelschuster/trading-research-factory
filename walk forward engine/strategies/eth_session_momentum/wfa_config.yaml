# ETH Session Momentum Strategy – WFA Configuration
# EU→US Continuation on ETH/USDT 1h Binance perpetual
# EXP-20260321230000-01

walk_forward:
  training_months: 3
  testing_months: 1
  step_months: 1
  n_parameter_trials: 200
  min_bars_per_window: 600
  use_vectorized_backtest: true
  performance_mode: true
  save_detailed_results: true
  save_window_data: false
  output_directory: "strategies/eth_session_momentum/results"

data:
  source_file: "data/binance_ethusdt_1h_deep.csv"
  min_required_bars: 600

strategy:
  profile_key: "ETH_SESSION_MOMENTUM"
  parameter_ranges:
    # OPTIMIZED: Percentile threshold for EU session momentum
    momentum_percentile: [60.0, 70.0, 80.0]
    # OPTIMIZED: Minimum EU session return % to trigger
    min_momentum_pct: [0.1, 0.2, 0.3, 0.5]
    # PINNED: EU session window
    eu_start_hour: [8]
    eu_end_hour: [15]
    # PINNED: Entry fires at eu_end_hour (entry_hour param now unused but kept for exit calc)
    entry_hour: [15]
    # OPTIMIZED: Exit hour
    exit_hour: [20, 21, 22]
    # PINNED: ATR period for SL/TP
    atr_period: [14]
    # OPTIMIZED: Stop-loss ATR multiplier
    sl_atr_mult: [1.5, 2.0, 2.5]
    # OPTIMIZED: Take-profit risk-reward ratio
    tp_rr_mult: [1.0, 1.5, 2.0]
    # PINNED: Long-only (no short side in base test)
    use_short_side: [false]

advanced_optimization:
  primary_objective: "sharpe"
  secondary_objectives:
    - "stability"
  stability_weight: 0.05
  n_startup_trials: 10

backtest:
  initial_balance: 100000.0
  fees: 0.0006
  slippage: 0.0002

performance:
  max_execution_time_seconds: 3600
  skip_database_persistence: true

logging:
  level: "INFO"
  console_output: true
  file_output: true
  log_file: "logs/wfa_eth_session_momentum.log"
