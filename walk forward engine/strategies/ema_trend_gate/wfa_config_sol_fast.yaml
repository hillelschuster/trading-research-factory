# EMA Trend Gate Strategy – SOLUSDT WFA Configuration (Fast version)
# Multi-Timeframe EMA Confluence with 4h Trend Gate on SOL/USDT
# EXP-20260325105657-01 | Fast version with fewer trials

walk_forward:
  training_months: 3
  testing_months: 1
  step_months: 1
  n_parameter_trials: 20
  min_bars_per_window: 600
  use_vectorized_backtest: true
  performance_mode: true
  save_detailed_results: true
  save_window_data: false
  output_directory: "strategies/ema_trend_gate/results"

data:
  source_file: "data/binance_solusdt_1h_deep.csv"
  min_required_bars: 600

strategy:
  profile_key: "EMA_TREND_GATE"
  parameter_ranges:
    ema4h_period: [50]
    ema1h_period: [20]
    rsi_period: [14]
    rsi_oversold: [40.0, 45.0]
    rsi_overbought: [55.0, 60.0]
    hold_bars: [48, 72]
    sl_atr_mult: [2.0]
    tp_rr_mult: [2.0]

advanced_optimization:
  primary_objective: "sharpe"
  secondary_objectives:
    - "stability"
  stability_weight: 0.15
  n_startup_trials: 5

backtest:
  initial_balance: 100000.0
  fees: 0.0006
  slippage: 0.0002

performance:
  max_execution_time_seconds: 600
  skip_database_persistence: true

logging:
  level: "INFO"
  console_output: true
  file_output: true
  log_file: "logs/wfa_ema_trend_gate_sol_fast.log"
