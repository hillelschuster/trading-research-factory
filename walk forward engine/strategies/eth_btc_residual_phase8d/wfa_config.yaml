# Phase 8D screening route: ETH/BTC residual mean reversion on ETH H1.

walk_forward:
  training_months: 3
  testing_months: 1
  step_months: 1
  n_parameter_trials: 25
  min_bars_per_window: 600
  use_vectorized_backtest: true
  performance_mode: true
  save_detailed_results: true
  save_window_data: false
  output_directory: "strategies/eth_btc_residual_phase8d/results"

data:
  source_file: "data/phase8d_eth_btc_residual_1h.csv"
  min_required_bars: 600
  timezone: "UTC"

strategy:
  profile_key: "ETH_BTC_RESIDUAL_PHASE8D"
  parameter_ranges:
    lookback: [24, 48, 72, 96]
    entry_threshold: [1.5, 2.0, 2.5, 3.0]
    exit_threshold: [-0.25, 0.0, 0.25, 0.5]
    hold_bars: [6, 12, 18, 24]
    sl_atr_mult: [1.5, 2.0, 2.5]
    tp_rr_mult: [1.0, 1.5, 2.0, 2.5]

advanced_optimization:
  primary_objective: "sharpe"
  secondary_objectives:
    - "stability"
    - "return"
  stability_weight: 0.15
  n_startup_trials: 8

backtest:
  initial_balance: 10000.0
  fees: 0.0006
  slippage: 0.0002

performance:
  max_execution_time_seconds: 3600
  skip_database_persistence: true

logging:
  level: "INFO"
  console_output: true
  file_output: true
  log_file: "logs/wfa_eth_btc_residual_phase8d.log"
