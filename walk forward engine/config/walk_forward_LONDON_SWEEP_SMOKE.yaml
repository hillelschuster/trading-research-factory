# WFA Smoke Test Configuration for London Sweep & Fade Strategy
# Short test: 2020-2021 only (faster validation)

strategy:
  name: "LondonSweepFade"
  asset_type: "forex"
  symbol: "EURUSD"
  timeframe: "M15"

data:
  start_date: "2020-01-01"
  end_date: "2021-12-31"
  source_file: "data/Eurousd_M15_2003-2025/EURUSD_M15_2011_2025_COMBINED.csv"
  timezone: "UTC"

walk_forward:
  training_months: 6
  testing_months: 1
  step_months: 1
  min_bars_per_window: 500
  allow_overlap: false

optimization:
  trials: 20  # Reduced for smoke test
  timeout_seconds: 600
  objective: "sharpe_ratio"
  
  parameters:
    sweep_min_atr: [0.25, 0.3, 0.4]
    sweep_max_atr: [0.8, 1.0, 1.2]
    stop_loss_atr: [0.4, 0.5, 0.6]
    asian_range_max_atr: [1.2, 1.5, 2.0]
    volume_spike_mult: [1.3, 1.5, 2.0]

execution:
  max_concurrent_backtests: 4
  enable_progress_tracking: true
  min_trades_per_window: 5

output:
  save_detailed_results: true
  export_formats: ["csv", "json"]
  include_trade_details: true
