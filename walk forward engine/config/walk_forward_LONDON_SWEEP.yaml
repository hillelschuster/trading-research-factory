# WFA Configuration for London Sweep & Fade Strategy
# Per implementation_plan.md v4

strategy:
  name: "LondonSweepFade"
  asset_type: "forex"
  symbol: "EURUSD"
  timeframe: "M15"

data:
  start_date: "2011-01-01"
  end_date: "2025-12-31"
  source_file: "data/Eurousd_M15_2003-2025/EURUSD_M15_2011_2025_COMBINED.csv"
  timezone: "UTC"
  
  validation:
    min_bars: 1000
    max_gaps: 5
    quality_threshold: 0.95

walk_forward:
  training_months: 6
  testing_months: 1
  step_months: 1
  min_bars_per_window: 500
  allow_overlap: false

optimization:
  trials: 100
  timeout_seconds: 3600
  objective: "sharpe_ratio"
  
  # ATR-scaled parameters per v4 plan
  parameters:
    sweep_min_atr: [0.25, 0.3, 0.4]
    sweep_max_atr: [0.8, 1.0, 1.2]
    stop_loss_atr: [0.4, 0.5, 0.6]
    asian_range_max_atr: [1.2, 1.5, 2.0]
    volume_spike_mult: [1.3, 1.5, 2.0]
    slippage_pips: [0.3, 0.5, 0.7]

execution:
  max_concurrent_backtests: 4
  enable_progress_tracking: true
  enable_performance_monitoring: true
  min_trades_per_window: 10
  statistical_significance_threshold: 0.05

output:
  save_detailed_results: true
  save_window_data: false
  export_formats: ["csv", "json"]
  include_trade_details: true
  include_parameter_history: true
  include_performance_metrics: true

metadata:
  description: "London Sweep & Fade - Mean reversion on false breakouts of Asian range"
  author: "WFA Engine"
  version: "1.0.0"
  created_date: "2026-01-05"
  tags: ["mean_reversion", "london_session", "forex", "sweep_fade"]
  environment: "development"
  data_source: "historical"
  market_conditions: "ranging"
  expected_performance: "moderate"
