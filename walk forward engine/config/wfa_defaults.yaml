# WFA System Configuration Template
# Complete YAML configuration for Walk-Forward Analysis system
# Supports multi-asset analysis with forex, crypto, stocks, and other asset types

# =============================================================================
# STRATEGY CONFIGURATION
# =============================================================================
strategy:
  name: "MeanReversionRSI"              # Strategy name (must match implemented strategy)
  asset_type: "forex"                   # Asset type: forex, crypto, stocks, commodities, indices, bonds, options, futures
  symbol: "EURUSD"                      # Trading symbol (e.g., EURUSD, BTCUSD, AAPL)
  timeframe: "M15"                      # Analysis timeframe: M1, M5, M15, M30, H1, H4, D1, W1, MN1

# =============================================================================
# DATA CONFIGURATION
# =============================================================================
data:
  start_date: "2011-01-01"              # Analysis start date (YYYY-MM-DD format)
  end_date: "2011-12-31"                # Analysis end date (YYYY-MM-DD format)
  source_file: "data/EURUSD_M15_2011_FULL.csv"  # Path to data file (optional, for reference)
  
  # Data validation settings (optional)
  validation:
    min_bars: 1000                      # Minimum bars required for analysis
    max_gaps: 5                         # Maximum allowed data gaps
    quality_threshold: 0.95             # Data quality threshold (0.0-1.0)

# =============================================================================
# WALK-FORWARD ANALYSIS CONFIGURATION
# =============================================================================
walk_forward:
  training_months: 6                    # Training window size in months
  testing_months: 1                     # Testing window size in months  
  step_months: 1                        # Step size for window advancement
  min_bars_per_window: 500              # Minimum bars required per window
  
  # Window overlap settings (optional)
  allow_overlap: false                  # Allow training/testing window overlap
  gap_months: 0                         # Gap between training and testing windows

# =============================================================================
# PARAMETER OPTIMIZATION CONFIGURATION
# =============================================================================
optimization:
  trials: 100                           # Number of optimization trials per window
  timeout_seconds: 3600                 # Maximum optimization time per window (1 hour)
  objective: "sharpe_ratio"             # Optimization objective: sharpe_ratio, total_return, profit_factor, max_drawdown
  
  # Strategy-specific parameter ranges
  parameters:
    rsi_period: [10, 14, 20]            # RSI period values to test
    rsi_overbought: [70, 75, 80]        # RSI overbought threshold values
    rsi_oversold: [20, 25, 30]          # RSI oversold threshold values
    
    # Additional parameters (uncomment as needed)
    # stop_loss_pips: [10, 20, 30]      # Stop loss in pips
    # take_profit_pips: [20, 40, 60]    # Take profit in pips
    # max_positions: [1, 2, 3]          # Maximum concurrent positions

# =============================================================================
# EXECUTION CONFIGURATION
# =============================================================================
execution:
  max_concurrent_backtests: 4           # Maximum parallel backtest processes
  enable_progress_tracking: true        # Enable progress display
  enable_performance_monitoring: true   # Enable performance monitoring
  
  # Validation thresholds
  min_trades_per_window: 10             # Minimum trades required per window
  statistical_significance_threshold: 0.05  # Statistical significance level
  
  # Performance settings
  memory_limit_gb: 4                    # Memory usage limit
  cpu_cores: null                       # CPU cores to use (null = auto-detect)

# =============================================================================
# OUTPUT CONFIGURATION
# =============================================================================
output:
  save_detailed_results: true           # Save detailed window-by-window results
  save_window_data: false               # Save individual window data files
  export_formats: ["csv", "json"]       # Export formats for results
  
  # Result aggregation settings
  include_trade_details: true           # Include individual trade information
  include_parameter_history: true       # Include parameter optimization history
  include_performance_metrics: true     # Include comprehensive performance metrics

# =============================================================================
# ASSET-SPECIFIC CONFIGURATIONS (Examples)
# =============================================================================

