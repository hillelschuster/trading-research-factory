# =============================================================================
# METADATA (Optional)
# =============================================================================
metadata:
  description: "WFA analysis for MeanReversionRSI strategy"
  author: "Prop Firm Trading Bot"
  version: "1.0.0"
  created_date: "2025-01-31"
  tags: ["mean_reversion", "rsi", "forex"]
  
  # Environment information
  environment: "development"            # development, testing, production
  data_source: "historical"             # historical, live, paper
  
  # Analysis context
  market_conditions: "ranging"          # trending, ranging, volatile
  expected_performance: "moderate"      # conservative, moderate, aggressive
