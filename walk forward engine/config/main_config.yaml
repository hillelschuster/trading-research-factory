- EURUSD_LONDON_BREAKOUT
bot_settings:
  app_name: PropFirmAlgoBot
  ftmo_server_timezone: Europe/Prague
  main_loop_delay_seconds: 10
  trading_mode: paper
leverage_constraints:
  margin_buffer_pct: 0.05
  margin_check_enabled: true
  max_leverage_ratio: 30
logging:
  backup_count: 7
  directory: logs
  file_name_prefix: trading_bot_text
  json_log_file_name_prefix: trading_bot_structured
  level: INFO
  log_format: '%(asctime)s - %(app_name)s - [%(levelname)s] - %(name)s - %(module)s.%(funcName)s:%(lineno)d
    - %(message)s'
  max_bytes: 10485760
  structured_logging: true
operational_compliance:
  enforce_weekend_closure: false
  is_swing_account: true
  market_close_blackout_period_hours: 4
  max_order_modifications_per_minute_total: 10
  max_orders_per_second: 20
  max_total_orders_per_day: 1800
  min_trade_duration_seconds: 61
platform:
  ctrader:
    account_id_env_var: CTRADER_ACCOUNT_ID
    client_id_env_var: CTRADER_CLIENT_ID
    client_secret_env_var: CTRADER_CLIENT_SECRET
    host_type: demo
  mt5:
    account_env_var: MT5_ACCOUNT
    magic_number_default: 12345
    password_env_var: MT5_PASSWORD
    path: C:\Program Files\FTMO Global Markets MT5 Terminal\terminal64.exe
    server_env_var: MT5_SERVER
    slippage_default_points: 20
    timeout_ms: 10000
  name: MetaTrader5
risk_management:
  default_risk_per_trade_idea_pct: 0.01
  global_daily_drawdown_limit_pct: 0.045
  global_max_account_drawdown_pct: 0.09
  max_concurrent_trades_per_strategy_type: 999
  max_total_concurrent_trades: 999
state_management:
  persistence_file: state/bot_state.json
  persistence_interval_seconds: 300
strategy_definitions:
  BB_WIDTH_SQUEEZE:
    description: 'BB Width Squeeze – Volatility expansion breakout: BB Width contraction
      (squeeze) precedes explosive moves; enter on bandwidth expansion with momentum
      confirmation.'
